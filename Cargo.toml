[package]
name = "dsn"
version = "1.3.0"
authors = ["Nicolas Embriz <nbari@tequila.io>"]
description = "DSN (Data Source Name) parser"
documentation = "https://docs.rs/dsn/latest/dsn/"
homepage = "https://docs.rs/dsn/latest/dsn/"
repository = "https://github.com/nbari/dsn"
readme = "README.md"
keywords = ["database", "dsn", "parser"]
categories = ["parsing", "database"]
license = "BSD-3-Clause"
edition = "2024"
rust-version = "1.85"

[lints.rust]
warnings = "deny"

[lints.clippy]
# Allow unstable/opinionated lints (lower priority so individual lints can override)
nursery = { level = "allow", priority = -1 }

# Enforce pedantic lints
pedantic = "deny"

# Core lint groups
all = "deny"
correctness = "deny"
suspicious = "deny"
perf = "deny"
complexity = "deny"

# Safety-critical lints
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
await_holding_lock = "deny"

# Performance + memory reliability
needless_borrow = "deny"
needless_collect = "deny"
large_stack_arrays = "deny"

[dependencies]
percent-encoding = "2.3.2"
